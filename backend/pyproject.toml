[project]
name = "tod-game-backend"
version = "0.1.0"
description = "Truth-or-Dare 18+ online game backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "questions"]
